name: Build and deploy to Azure Container Apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ica-landing:test .

      - name: Smoke test
        run: |
          docker run -d --name ica -p 8080:8080 ica-landing:test
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "IvoryCoast Advisory"
          curl -fsSI http://localhost:8080/logo.png | grep -qi "content-type: image/png"

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Serialize deploys so two quick pushes can't race each other.
    concurrency:
      group: deploy-ica-landing
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'ica-landing' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Azure configuration
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_ACR_NAME; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets/variables:$missing. See README.md, 'Azure setup'."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # The container listens on 8080. Set the ingress target port explicitly:
      # the deploy action's targetPort is only documented to apply when it
      # creates a new app, not when it updates an existing one.
      - name: Point ingress at port 8080
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp ingress update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --target-port 8080

      - name: Build, push and deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: ${{ env.AZURE_ACR_NAME }}
          imageToBuild: ${{ env.AZURE_ACR_NAME }}.azurecr.io/${{ env.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          targetPort: 8080
          ingress: external
