server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. Do not add add_header inside a location block below:
    # nginx would then stop inheriting these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness/readiness probe for Azure Container Apps.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML is revalidated on every load so a new deploy shows up immediately.
    location = /index.html {
        expires -1;
    }

    location = / {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 7d;
    }
}
